# miryo-link contract: what the three apps must agree on to find each other.
# Same file in miryo, miryo tube and miryo iptv (app/src/test/resources): change it in the three,
# then each app's LinkContractTest checks its constants and its manifest against it.
install.miryo=dev.miraiijo.lumen
install.miryotube=dev.miraiijo.lumentube
install.miryoiptv=dev.miraiijo.lumeniptv
authority.profiles=dev.miraiijo.miryo.profiles
authority.tube=dev.miraiijo.miryotube.feed
authority.iptv=dev.miraiijo.miryoiptv.rows
scheme.iptv=miryoiptv
extra.profile=dev.miraiijo.link.extra.PROFILE_ID
extra.kids=dev.miraiijo.miryo.extra.KIDS
extra.account=dev.miraiijo.miryo.extra.ACCOUNT_ID
extra.skipPicker=dev.miraiijo.miryo.extra.SKIP_PICKER
extra.contract=dev.miraiijo.miryo.extra.CONTRACT
