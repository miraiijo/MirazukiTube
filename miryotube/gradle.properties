org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# Upstream modules still pull a few old support-library artifacts.
android.enableJetifier=true
android.jetifier.ignorelist=bcprov
# Upstream code relies on AGP 7 defaults: R classes of dependencies, R ids usable in switch.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Protobuf Gradle plugin (exoplayer-library-sabr) casts the `android` extension to BaseExtension.
android.newDsl=false
# Cronet 105 splits its AARs (cronet-api, cronet-common, cronet-embedded) under the same org.chromium.net package.
android.uniquePackageNames=false
kotlin.code.style=official
# miryo-link v3: SHA-256 of the signing certificates of the miryo apps (public, read from any APK,
# not secrets), written by `mirazuki-keys init` on the PC. Empty = no link with that app.
