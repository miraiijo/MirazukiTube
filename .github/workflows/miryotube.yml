name: miryo tube APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "miryotube/**"
      - "MediaServiceCore"
      - "SharedModules"
      - "exoplayer-amzn-2.10.6/**"
      - ".github/workflows/miryotube.yml"
  pull_request:
    paths:
      - "miryotube/**"
      - "MediaServiceCore"
      - "SharedModules"
      - "exoplayer-amzn-2.10.6/**"
      - ".github/workflows/miryotube.yml"

# Build and check only: the APK comes out UNSIGNED. Signing and publishing happen on the Mac
# (mirazuki-ship: the key never leaves it), so there is no secret at all in GitHub. Read-only token:
# this workflow publishes nothing (the APK is a workflow artifact, signed by mirazuki-ship
# then published on miraiijo/miryo-releases).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit (version in the comment), not to a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # SmartTube's engine (MediaServiceCore, SharedModules)
          persist-credentials: false # the token isn't left in .git/config for the build steps

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle's wrapper validation scans the whole repo and rejects SmartTube's own wrappers
      # (root and exoplayer-amzn-2.10.6), which this build never runs. Only miryo tube's wrapper is
      # executed, so only that one is checked, against Gradle's published checksum.
      - name: Validate miryo tube's Gradle wrapper
        run: |
          version=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' miryotube/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          actual=$(sha256sum miryotube/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "Gradle $version wrapper: expected $expected, got $actual"
          test "$expected" = "$actual"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          validate-wrappers: false

      # TV legibility: no text below 13 sp in miryo tube's Kotlin (Dimens.TextMin = 13 sp). Fails on
      # any literal 0–12.99 sp (font sizes and line heights alike), passes otherwise.
      - name: Check minimum text size (13 sp)
        run: |
          if grep -rnE '\b([0-9]|1[0-2])(\.[0-9]+)?f?\.sp\b' miryotube/app/src/main/java; then
            echo "::error title=Text below 13 sp::use Dimens.TextMin (13 sp) or larger"
            exit 1
          fi
          echo "No text below 13 sp."

      - name: Build release APK
        working-directory: miryotube
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --build-cache :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build.log

      - name: Run Android Lint
        # Blocking: any lint error fails the build (no baseline). The errors are printed in the log.
        working-directory: miryotube
        run: |
          ./gradlew --no-daemon --build-cache :app:lintRelease || { grep -B1 -A4 ': Error: ' app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt | head -300; exit 1; }

      - name: Report build errors
        if: failure()
        working-directory: miryotube
        run: |
          # Compiler / Gradle errors as one annotation (readable from the API without the log download).
          msg=$(grep -E '^e: |^\* What went wrong|error:|FAILED|Exception' build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:-no matching lines}"
          msg2=$(grep -A12 '^\* What went wrong' build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$msg2" ] && echo "::error title=What went wrong::$msg2" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miryotube-unsigned
          path: miryotube/app/build/outputs/apk/release/*.apk
          retention-days: 30
